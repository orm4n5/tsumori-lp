<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSUMORI貯金 - スワイプで楽しく貯金管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- 基本設定（ライトモード・ミントグリーン基調） --- */
        :root {
            --bg-color: #f0fdf4; /* 薄いグリーンの背景 */
            --card-bg: #ffffff;
            --accent-color: #0d9488; /* アプリヘッダーに合わせたティールグリーン */
            --text-main: #334155;
            --text-sub: #64748b;
        }

        body {
            margin: 0;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- レイアウト --- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            padding: 40px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        /* --- ヒーローセクション --- */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 0 100px;
            gap: 40px;
        }

        .hero-content {
            flex: 1;
        }

        .hero-title {
            font-size: 3rem;
            line-height: 1.3;
            margin-bottom: 24px;
            color: #0f172a;
        }

        .hero-description {
            font-size: 1.2rem;
            color: var(--text-sub);
            margin-bottom: 40px;
        }

        /* --- スマホモックアップ (CSS製・ライトテーマ向け調整) --- */
        .phone-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            perspective: 1000px;
        }

        .phone-mockup {
            width: 280px;
            height: 580px;
            background: #ffffff;
            border: 8px solid #cbd5e1; /* ライトグレーのフレーム */
            border-radius: 36px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        /* インカメラ部分のノッチ */
        .phone-mockup::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 25px;
            background: #cbd5e1;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 10;
        }

        .phone-mockup video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 28px;
        }

        /* --- ボタン --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--accent-color);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px -1px rgba(13, 148, 136, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            background-color: #0f766e;
            box-shadow: 0 10px 15px -3px rgba(13, 148, 136, 0.3);
        }

        /* --- レスポンシブ --- */
        @media (max-width: 768px) {
            .hero {
                flex-direction: column;
                text-align: center;
                padding: 40px 0;
            }
            .hero-title {
                font-size: 2.2rem;
            }
            .phone-mockup {
                width: 240px;
                height: 500px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">TSUMORI貯金</div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">わずか3秒で記録。<br>スワイプで楽しく<br>「つもり貯金」</h1>
            <p class="hero-description">
                ジュースやコーヒーを我慢したその瞬間に。直感的な操作と達成感のある演出で、あなたの節約を楽しくサポートします。
            </p>
            <a href="https://play.google.com/store/apps/details?id=com.ormsng.tsumori" class="btn" target="_blank" rel="noopener noreferrer">
                Google Play でダウンロード
            </a>
        </div>

        <div class="phone-wrapper">
            <div class="phone-mockup">
                <video autoplay muted loop playsinline>
                    <source src="1000008827.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
    </section>
</div>

</body>
</html>
